<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grupo LemosPassos: acima de tudo, o cuidado." />
    <title>Grupo LemosPassos</title>
    <link rel="icon" type="image/png" href="./assets/lemos-passos.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="intro" aria-label="Abertura Grupo LemosPassos">
      <section class="intro-stage">
        <img class="intro-logo" src="./assets/lemos-passos.png" alt="Grupo LemosPassos" />

        <h1 class="typewriter" aria-label="acima de tudo, o cuidado.">
          <span class="type-line">
            <span id="typedLineOne"></span><span id="cursor" class="cursor">|</span>
          </span>
          <span class="type-line type-line-care">
            <span id="typedCareLead"></span><span id="typedCareWord" class="care-word"></span>
          </span>
        </h1>

        <p id="signature" class="signature">grupo lemospassos</p>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
